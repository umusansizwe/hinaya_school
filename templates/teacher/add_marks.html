<!DOCTYPE html>
<html>
<head>
    <title>Add Marks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Add Marks</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Class</label>
                        <select name="class_id" class="form-control" required>
                            <option value="">Select Class</option>
                            {% for class in classes %}
                            <option value="{{ class.id }}">{{ class.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Subject</label>
                        <select name="subject_id" class="form-control" required>
                            <option value="">Select Subject</option>
                            {% for subject in subjects %}
                            <option value="{{ subject.id }}">{{ subject.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Term</label>
                        <select name="term_id" class="form-control" required>
                            <option value="">Select Term</option>
                            {% for term in terms %}
                            <option value="{{ term.id }}">{{ term.name }} - {{ term.year }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Student</label>
                        <select name="student_id" class="form-control" required>
                            <option value="">Select Student</option>
                            <!-- Student list will be populated by JavaScript or server-side -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Score</label>
                        <input type="number" name="score" class="form-control" min="0" max="100" step="0.01" required>
                    </div>
                    <button type="submit" class="btn btn-success">Save Marks</button>
                    <a href="/teacher/" class="btn btn-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
