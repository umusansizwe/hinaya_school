<!DOCTYPE html>
<html>
<head>
    <title>Edit Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">🏫 HINAYA - Edit Staff</span>
            <a href="/headmaster/staff/" class="btn btn-light btn-sm">Back</a>
            <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4><i class="bi bi-pencil"></i> Edit Staff</h4>
            </div>
            <div class="card-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-success">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ staff.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Staff Type</label>
                        <select name="staff_type" class="form-control">
                            <option value="cook" {% if staff.staff_type == 'cook' %}selected{% endif %}>Cook</option>
                            <option value="gardener" {% if staff.staff_type == 'gardener' %}selected{% endif %}>Gardener</option>
                            <option value="cleaner" {% if staff.staff_type == 'cleaner' %}selected{% endif %}>Cleaner</option>
                            <option value="security" {% if staff.staff_type == 'security' %}selected{% endif %}>Security</option>
                            <option value="driver" {% if staff.staff_type == 'driver' %}selected{% endif %}>Driver</option>
                            <option value="other" {% if staff.staff_type == 'other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ staff.phone }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-control">
                            <option value="M" {% if staff.gender == 'M' %}selected{% endif %}>Male</option>
                            <option value="F" {% if staff.gender == 'F' %}selected{% endif %}>Female</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Salary</label>
                        <input type="number" name="salary" class="form-control" value="{{ staff.salary }}" step="0.01">
                    </div>
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-save"></i> Update Staff
                    </button>
                    <a href="/headmaster/staff/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
