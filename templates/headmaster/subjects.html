<!DOCTYPE html>
<html>
<head>
    <title>Subjects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">🏫 HINAYA - Subjects</span>
            <a href="/headmaster/" class="btn btn-light btn-sm">Back</a>
            <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Subjects List</h2>
        <a href="/headmaster/add_subject/" class="btn btn-success mb-3">Add Subject</a>
        <div class="card">
            <div class="card-body">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Code</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for subject in subjects %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ subject.name }}</td>
                            <td>{{ subject.code }}</td>
                            <td>{% if subject.is_active %}✅ Active{% else %}❌ Inactive{% endif %}</td>
                            <td>
                                <a href="/headmaster/edit_subject/{{ subject.id }}/" class="btn btn-warning btn-sm">Edit</a>
                                <a href="/headmaster/delete_subject/{{ subject.id }}/" class="btn btn-danger btn-sm">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="5" class="text-center">No subjects found</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
