<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-danger">
        <div class="container-fluid">
            <span class="navbar-brand">🔐 Admin Panel</span>
            <span class="text-white">Welcome, {{ user.first_name }}</span>
            <a href="/logout/" class="btn btn-light btn-sm">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Admin Dashboard</h2>
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h1>{{ total_users }}</h1>
                        <p>Total Users</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h1>{{ total_students }}</h1>
                        <p>Students</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h1>{{ total_teachers }}</h1>
                        <p>Teachers</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h1>{{ total_staff }}</h1>
                        <p>Staff</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <a href="/admin_panel/update_profile/" class="btn btn-primary">Update School Profile</a>
            <a href="/admin/" class="btn btn-warning">Django Admin</a>
        </div>
    </div>
</body>
</html>
