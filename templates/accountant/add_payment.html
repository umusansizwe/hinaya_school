<!DOCTYPE html>
<html>
<head>
    <title>Add Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4>Add Payment</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Student</label>
                        <select name="fee_id" class="form-control" required>
                            <option value="">Select Student</option>
                            {% for debtor in debtors %}
                            <option value="{{ debtor.id }}">{{ debtor.student.first_name }} {{ debtor.student.last_name }} - Balance: {{ debtor.balance|floatformat:2 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Amount</label>
                        <input type="number" name="amount" class="form-control" step="0.01" required>
                    </div>
                    <button type="submit" class="btn btn-info">Add Payment</button>
                    <a href="/accountant/" class="btn btn-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
