<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">🏫 HINAYA - Settings</span>
            <a href="/headmaster/" class="btn btn-light btn-sm">Back</a>
            <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4>⚙️ Headmaster Settings</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header bg-info text-white">
                                    <h5>Academic Settings</h5>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label>Current Academic Year</label>
                                        <input type="text" name="academic_year" class="form-control" value="2025">
                                    </div>
                                    <div class="mb-3">
                                        <label>Default Term</label>
                                        <select name="default_term" class="form-control">
                                            <option value="Term 1">Term 1</option>
                                            <option value="Mid Term 1">Mid Term 1</option>
                                            <option value="Term 2">Term 2</option>
                                            <option value="Mid Term 2">Mid Term 2</option>
                                            <option value="Term 3">Term 3</option>
                                            <option value="Mid Term 3">Mid Term 3</option>
                                            <option value="Mid Term 4">Mid Term 4</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-header bg-warning text-dark">
                                    <h5>System Settings</h5>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label>School Name</label>
                                        <input type="text" name="school_name" class="form-control" value="HINAYA PRE AND PRIMARY SCHOOL">
                                    </div>
                                    <div class="mb-3">
                                        <label>School Phone</label>
                                        <input type="text" name="school_phone" class="form-control" value="+255 000 000 000">
                                    </div>
                                    <div class="mb-3">
                                        <label>School Email</label>
                                        <input type="email" name="school_email" class="form-control" value="info@hinaya.ac.tz">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">Save Settings</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
