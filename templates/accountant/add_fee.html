<!DOCTYPE html>
<html>
<head>
    <title>Add Fee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">🏫 HINAYA - Add Fee</span>
            <a href="/accountant/" class="btn btn-light btn-sm">Back</a>
            <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4><i class="bi bi-cash"></i> Add Fee</h4>
            </div>
            <div class="card-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-success">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Student</label>
                        <select name="student_id" class="form-control" required>
                            <option value="">Select Student</option>
                            {% for student in students %}
                                <option value="{{ student.id }}">{{ student.first_name }} {{ student.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Term</label>
                        <select name="term_id" class="form-control" required>
                            <option value="">Select Term</option>
                            {% for term in terms %}
                                <option value="{{ term.id }}">{{ term.name }} - {{ term.year }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Total Fee</label>
                        <input type="number" name="total_fee" class="form-control" placeholder="Enter total fee" step="0.01" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save"></i> Save Fee
                    </button>
                    <a href="/accountant/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
