<!DOCTYPE html>
<html>
<head>
    <title>Add Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Add Staff</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Staff Type</label>
                        <select name="staff_type" class="form-control">
                            <option value="cook">Cook</option>
                            <option value="gardener">Gardener</option>
                            <option value="cleaner">Cleaner</option>
                            <option value="security">Security</option>
                            <option value="driver">Driver</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text" name="phone" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Gender</label>
                        <select name="gender" class="form-control">
                            <option value="M">Male</option>
                            <option value="F">Female</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Salary</label>
                        <input type="number" name="salary" class="form-control" step="0.01">
                    </div>
                    <button type="submit" class="btn btn-success">Save Staff</button>
                    <a href="/headmaster/staff/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
