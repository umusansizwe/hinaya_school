<!DOCTYPE html>
<html>
<head>
    <title>Edit Term</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-warning text-white">
                <h4>Edit Term</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Term Name</label>
                        <select name="name" class="form-control" required>
                            <option value="Term 1" {% if term.name == 'Term 1' %}selected{% endif %}>Term 1</option>
                            <option value="Mid Term 1" {% if term.name == 'Mid Term 1' %}selected{% endif %}>Mid Term 1</option>
                            <option value="Term 2" {% if term.name == 'Term 2' %}selected{% endif %}>Term 2</option>
                            <option value="Mid Term 2" {% if term.name == 'Mid Term 2' %}selected{% endif %}>Mid Term 2</option>
                            <option value="Term 3" {% if term.name == 'Term 3' %}selected{% endif %}>Term 3</option>
                            <option value="Mid Term 3" {% if term.name == 'Mid Term 3' %}selected{% endif %}>Mid Term 3</option>
                            <option value="Mid Term 4" {% if term.name == 'Mid Term 4' %}selected{% endif %}>Mid Term 4</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Year</label>
                        <input type="text" name="year" class="form-control" value="{{ term.year }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Start Date</label>
                        <input type="date" name="start_date" class="form-control" value="{{ term.start_date|date:'Y-m-d' }}" required>
                    </div>
                    <div class="mb-3">
                        <label>End Date</label>
                        <input type="date" name="end_date" class="form-control" value="{{ term.end_date|date:'Y-m-d' }}" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if term.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>
                    <button type="submit" class="btn btn-warning">Update Term</button>
                    <a href="/headmaster/terms/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
