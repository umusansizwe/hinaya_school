<!DOCTYPE html>
<html>
<head>
    <title>HINAYA School Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 50%, #2d1b69 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 40px 35px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }
        .login-card .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c3ce0, #9b59b6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 45px;
            font-weight: 700;
            color: white;
            border: 4px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 40px rgba(108,60,224,0.3);
        }
        .login-card h2 {
            color: white;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
        }
        .login-card .subtitle {
            color: rgba(255,255,255,0.6);
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .login-card .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: white;
        }
        .login-card .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: #6c3ce0;
            box-shadow: 0 0 30px rgba(108,60,224,0.15);
            color: white;
        }
        .login-card .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .login-card label { color: rgba(255,255,255,0.7); font-weight: 600; font-size: 13px; letter-spacing: 1px; }
        .login-card .btn-login {
            background: linear-gradient(135deg, #6c3ce0, #9b59b6);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: 0.3s;
        }
        .login-card .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108,60,224,0.4);
        }
        .demo-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }
        .demo-box small { color: rgba(255,255,255,0.4); font-size: 11px; }
        .demo-box strong { color: #c9b0ff; }
        .demo-box .row small { color: rgba(255,255,255,0.5); font-size: 11px; }
        .alert-custom { background: rgba(255,0,0,0.15); border: 1px solid rgba(255,0,0,0.2); color: #ff6b6b; border-radius: 12px; padding: 10px 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="login-card">
                    <div class="logo">H</div>
                    <h2>HINAYA</h2>
                    <p class="subtitle">PRE & PRIMARY SCHOOL</p>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert-custom mb-3">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                        </div>
                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn-login">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Login
                        </button>
                    </form>
                    
                    <div class="demo-box text-center">
                        <small class="text-uppercase fw-bold">Demo Accounts</small>
                        <div class="row mt-2">
                            <div class="col-6"><small><strong>Headmaster:</strong><br>headmaster / headmaster123</small></div>
                            <div class="col-6"><small><strong>Teacher:</strong><br>teacher / teacher123</small></div>
                            <div class="col-6 mt-1"><small><strong>Accountant:</strong><br>accountant / accountant123</small></div>
                            <div class="col-6 mt-1"><small><strong>Parent:</strong><br>parent / parent123</small></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
