<!DOCTYPE html>
<html>
<head>
    <title>Add Class</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Add Class</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Class Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g., Standard 1" required>
                    </div>
                    <div class="mb-3">
                        <label>Academic Year</label>
                        <input type="text" name="academic_year" class="form-control" placeholder="e.g., 2025" required>
                    </div>
                    <button type="submit" class="btn btn-success">Save Class</button>
                    <a href="/headmaster/classes/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
