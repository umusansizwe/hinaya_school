<!DOCTYPE html>
<html>
<head>
    <title>Add Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Add Subject</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Subject Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g., Mathematics" required>
                    </div>
                    <div class="mb-3">
                        <label>Subject Code</label>
                        <input type="text" name="code" class="form-control" placeholder="e.g., MATH101" required>
                    </div>
                    <button type="submit" class="btn btn-success">Save Subject</button>
                    <a href="/headmaster/subjects/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
