<!DOCTYPE html>
<html>
<head>
    <title>Add Term</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Add Academic Term</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Term Name</label>
                        <select name="name" class="form-control" required>
                            <option value="Term 1">Term 1</option>
                            <option value="Mid Term 1">Mid Term 1</option>
                            <option value="Term 2">Term 2</option>
                            <option value="Mid Term 2">Mid Term 2</option>
                            <option value="Term 3">Term 3</option>
                            <option value="Mid Term 3">Mid Term 3</option>
                            <option value="Mid Term 4">Mid Term 4</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Year</label>
                        <input type="text" name="year" class="form-control" placeholder="e.g., 2025" required>
                    </div>
                    <div class="mb-3">
                        <label>Start Date</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>End Date</label>
                        <input type="date" name="end_date" class="form-control" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active">
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>
                    <button type="submit" class="btn btn-success">Save Term</button>
                    <a href="/headmaster/terms/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
