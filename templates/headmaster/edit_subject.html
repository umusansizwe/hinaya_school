<!DOCTYPE html>
<html>
<head>
    <title>Edit Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">🏫 HINAYA - Edit Subject</span>
            <a href="/headmaster/subjects/" class="btn btn-light btn-sm">Back</a>
            <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4><i class="bi bi-pencil"></i> Edit Subject</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Subject Name</label>
                        <input type="text" name="name" class="form-control" value="{{ subject.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Subject Code</label>
                        <input type="text" name="code" class="form-control" value="{{ subject.code }}" required>
                    </div>
                    <button type="submit" class="btn btn-warning">Update Subject</button>
                    <a href="/headmaster/subjects/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
