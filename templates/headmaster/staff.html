<!DOCTYPE html>
<html>
<head>
    <title>Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">🏫 HINAYA - Staff</span>
            <a href="/headmaster/" class="btn btn-light btn-sm">Back</a>
            <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Staff List</h2>
        <a href="/headmaster/add_staff/" class="btn btn-success mb-3">Add Staff</a>
        <div class="card">
            <div class="card-body">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for staff in staff %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ staff.name }}</td>
                            <td>{{ staff.get_staff_type_display }}</td>
                            <td>{{ staff.gender }}</td>
                            <td>{{ staff.phone }}</td>
                            <td>{{ staff.salary }}</td>
                            <td>
                                <a href="/headmaster/edit_staff/{{ staff.id }}/" class="btn btn-warning btn-sm">Edit</a>
                                <a href="/headmaster/delete_staff/{{ staff.id }}/" class="btn btn-danger btn-sm">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="7" class="text-center">No staff found</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
