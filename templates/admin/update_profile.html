<!DOCTYPE html>
<html>
<head>
    <title>Update School Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Update School Profile</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>School Name</label>
                        <input type="text" name="school_name" class="form-control" value="{{ profile.school_name|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label>Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ profile.address|default:'' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label>Location</label>
                        <input type="text" name="location" class="form-control" value="{{ profile.location|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ profile.phone|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" value="{{ profile.email|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label>Principal Name</label>
                        <input type="text" name="principal_name" class="form-control" value="{{ profile.principal_name|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label>Logo</label>
                        <input type="file" name="logo" class="form-control">
                        {% if profile.logo %}
                        <img src="{{ profile.logo.url }}" alt="Logo" style="height:100px; margin-top:10px;">
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label>Principal Signature</label>
                        <input type="file" name="principal_signature" class="form-control">
                        {% if profile.principal_signature %}
                        <img src="{{ profile.principal_signature.url }}" alt="Signature" style="height:50px; margin-top:10px;">
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-success">Save Profile</button>
                    <a href="/admin_panel/" class="btn btn-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
